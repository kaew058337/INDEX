<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ยืม-คืนเครื่องมือ</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --green: #06C755;
    --green-dark: #05a847;
    --red: #e5484d;
    --amber: #f59e0b;
    --bg: #f3f5f7;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Sarabun', 'Noto Sans Thai', -apple-system, 'Segoe UI', Tahoma, sans-serif;
    font-size: 16px; padding-bottom: 84px;
  }
  header {
    background: var(--green); color: #fff; padding: 16px 16px 18px;
    padding-top: calc(16px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 12px;
  }
  header img { width: 40px; height: 40px; border-radius: 50%; background: #fff3; object-fit: cover; }
  header .hello { font-size: 13px; opacity: .9; }
  header .name { font-size: 18px; font-weight: 700; }
  main { padding: 14px; max-width: 560px; margin: 0 auto; }

  .tab { display: none; }
  .tab.active { display: block; }

  .scan-btn {
    width: 100%; border: 0; border-radius: 20px; padding: 34px 16px;
    background: var(--green); color: #fff; font-size: 22px; font-weight: 700;
    box-shadow: 0 6px 16px #06c75540; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .scan-btn:active { background: var(--green-dark); transform: scale(.99); }
  .scan-btn svg { width: 54px; height: 54px; }
  .scan-sub { font-size: 14px; font-weight: 400; opacity: .95; }

  .manual { margin-top: 16px; display: flex; gap: 8px; }
  .manual input {
    flex: 1; padding: 14px; border: 1.5px solid var(--line); border-radius: 12px;
    font-size: 16px; text-transform: uppercase; background: #fff;
  }
  .manual button {
    padding: 0 18px; border: 0; border-radius: 12px; background: #111827; color: #fff; font-size: 16px; cursor: pointer;
  }

  h3 { margin: 22px 2px 8px; font-size: 15px; color: var(--muted); font-weight: 600; }

  .item {
    background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px #0000000d;
  }
  .item .ico {
    width: 44px; height: 44px; border-radius: 12px; background: #e8f9ef; color: var(--green-dark);
    display: grid; place-items: center; font-size: 22px; flex: none;
  }
  .item.out .ico { background: #fdecec; color: var(--red); }
  .item .info { flex: 1; min-width: 0; }
  .item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 12px; padding: 4px 10px; border-radius: 99px; font-weight: 600; flex: none; }
  .badge.free { background: #e8f9ef; color: var(--green-dark); }
  .badge.out { background: #fdecec; color: var(--red); }
  .item .act {
    border: 0; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; flex: none;
    background: var(--green); color: #fff;
  }
  .item .act.ret { background: var(--amber); }

  .hist {
    background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; gap: 12px; align-items: center;
  }
  .hist .tag { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 8px; flex: none; }
  .hist .tag.b { background: #fdecec; color: var(--red); }
  .hist .tag.r { background: #e8f9ef; color: var(--green-dark); }
  .hist .d { font-size: 12px; color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .search {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 16px; margin-bottom: 12px;
  }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 10;
  }
  nav button {
    flex: 1; border: 0; background: none; padding: 10px 0 8px; color: var(--muted);
    font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  }
  nav button .i { font-size: 22px; line-height: 1; }
  nav button.active { color: var(--green-dark); font-weight: 700; }

  /* bottom sheet */
  .overlay { position: fixed; inset: 0; background: #0006; display: none; z-index: 20; }
  .overlay.show { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 22px 22px 0 0;
    padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); z-index: 21;
    transform: translateY(105%); transition: transform .25s ease; max-width: 560px; margin: 0 auto;
  }
  .sheet.show { transform: none; }
  .sheet .big { font-size: 44px; text-align: center; }
  .sheet h2 { margin: 6px 0 2px; text-align: center; font-size: 22px; }
  .sheet .meta { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .sheet .warn { background: #fff7e6; color: #92400e; padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
  .sheet .note { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; margin-bottom: 12px; }
  .btn {
    width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 700; cursor: pointer;
    background: var(--green); color: #fff; margin-bottom: 8px;
  }
  .btn.ret { background: var(--amber); }
  .btn.ghost { background: #f3f4f6; color: var(--text); font-weight: 600; font-size: 16px; }
  .btn:disabled { opacity: .6; }

  .toast {
    position: fixed; left: 50%; top: 18px; transform: translate(-50%, -120px); transition: transform .3s;
    background: #111827; color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 40; font-size: 15px;
    max-width: 90%; text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast.ok { background: var(--green-dark); }
  .toast.err { background: var(--red); }

  .loading { position: fixed; inset: 0; background: #fffc; display: none; place-items: center; z-index: 50; }
  .loading.show { display: grid; }
  .spin { width: 42px; height: 42px; border: 4px solid #d1fae5; border-top-color: var(--green); border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  #fatal { display: none; padding: 40px 24px; text-align: center; }
  #fatal h2 { color: var(--red); }
</style>
</head>
<body>

<div id="fatal"></div>

<div id="app" style="display:none">
  <header>
    <img id="avatar" alt="">
    <div>
      <div class="hello">สวัสดี</div>
      <div class="name" id="uname">-</div>
    </div>
  </header>

  <main>
    <!-- สแกน -->
    <section class="tab active" id="tab-scan">
      <button class="scan-btn" id="btnScan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/>
          <rect x="8" y="8" width="3" height="3"/><rect x="13" y="8" width="3" height="3"/>
          <rect x="8" y="13" width="3" height="3"/><path d="M14 14h2v2h-2z"/>
        </svg>
        สแกน QR Code
        <span class="scan-sub">สแกนเครื่องมือเพื่อ ยืม หรือ คืน</span>
      </button>

      <div class="manual">
        <input id="manualId" placeholder="หรือพิมพ์รหัส เช่น T001" autocapitalize="characters" autocomplete="off">
        <button id="btnManual">ค้นหา</button>
      </div>

      <h3>เครื่องมือที่ฉันยืมอยู่</h3>
      <div id="miniMine"></div>
    </section>

    <!-- ของฉัน -->
    <section class="tab" id="tab-mine">
      <h3 style="margin-top:4px">เครื่องมือที่ฉันยืมอยู่</h3>
      <div id="mineList"></div>
    </section>

    <!-- ทั้งหมด -->
    <section class="tab" id="tab-all">
      <input class="search" id="search" placeholder="ค้นหาชื่อ / รหัส / หมวดหมู่">
      <div id="allList"></div>
    </section>

    <!-- ประวัติ -->
    <section class="tab" id="tab-hist">
      <h3 style="margin-top:4px">ประวัติล่าสุดของฉัน</h3>
      <div id="histList"></div>
    </section>
  </main>

  <nav>
    <button class="active" data-tab="scan"><span class="i">📷</span>สแกน</button>
    <button data-tab="mine"><span class="i">🧰</span>ของฉัน</button>
    <button data-tab="all"><span class="i">📋</span>ทั้งหมด</button>
    <button data-tab="hist"><span class="i">🕘</span>ประวัติ</button>
  </nav>
</div>

<!-- sheet ยืน/คืน -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="big" id="sIcon">🔧</div>
  <h2 id="sName">-</h2>
  <div class="meta" id="sMeta">-</div>
  <div class="warn" id="sWarn" style="display:none"></div>
  <input class="note" id="sNote" placeholder="หมายเหตุ (ไม่บังคับ)">
  <button class="btn" id="sAct">ยืม</button>
  <button class="btn ghost" id="sCancel">ยกเลิก</button>
</div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div></div>

<script>
/* ======================= ตั้งค่า (แก้ 2 บรรทัดนี้) ======================= */
const LIFF_ID = '2012083611-XFk0ry1Q';            // เช่น 1234567890-AbCdEfGh
const API_URL = 'https://script.google.com/macros/s/AKfycbzkOrvGQrzTqOYs8iUhQBWU4gr8ZNhHR8X7i3yBUybR6HsaIU7KnyZ5ghXheo46kYPWcw/exec'; // ลงท้ายด้วย /exec
/* ======================================================================== */

let me = { id: '', name: '' };
let allTools = [];
let current = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- API ---------- */
async function api(action, payload) {
  const idToken = liff.getIDToken();
  const res = await fetch(API_URL, {
    method: 'POST',                       // ไม่ใส่ header เพื่อเลี่ยง CORS preflight
    body: JSON.stringify(Object.assign({ action, idToken }, payload || {})),
  });
  const json = await res.json();
  if (!json.ok) {
    if (json.auth) { liff.logout(); liff.login(); }
    throw new Error(json.error || 'เกิดข้อผิดพลาด');
  }
  return json.data;
}

/* ---------- UI helpers ---------- */
function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}
function busy(on) { $('loading').classList.toggle('show', on); }
function fatal(msg) {
  $('app').style.display = 'none';
  $('fatal').style.display = 'block';
  $('fatal').innerHTML = '<h2>เปิดแอปไม่สำเร็จ</h2><p>' + esc(msg) + '</p>';
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(name) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
  if (name === 'mine') loadMine();
  if (name === 'all') loadAll();
  if (name === 'hist') loadHist();
  if (name === 'scan') loadMine();
}

/* ---------- แสดงรายการ ---------- */
function itemHtml(t, withAction) {
  const out = t.status === 'ถูกยืม';
  const mineNow = out && t.borrowerId === me.id;
  let sub = esc(t.id) + (t.category ? ' · ' + esc(t.category) : '');
  if (out) sub += '<br>ยืมโดย ' + (mineNow ? 'คุณ' : esc(t.borrower)) + (t.since ? ' · ' + esc(t.since) : '');
  let btn = '';
  if (withAction) btn = '<button class="act ' + (out ? 'ret' : '') + '" data-id="' + esc(t.id) + '">' + (out ? 'คืน' : 'ยืม') + '</button>';
  else btn = '<span class="badge ' + (out ? 'out' : 'free') + '">' + (out ? 'ถูกยืม' : 'ว่าง') + '</span>';
  return '<div class="item ' + (out ? 'out' : '') + '"><div class="ico">' + (out ? '🔒' : '🔧') + '</div>' +
    '<div class="info"><div class="t">' + esc(t.name) + '</div><div class="s">' + sub + '</div></div>' + btn + '</div>';
}
function bindActions(root) {
  root.querySelectorAll('.act').forEach(b => b.onclick = () => openTool(b.dataset.id));
}

async function loadMine() {
  try {
    const list = await api('mine');
    const html = list.length ? list.map(t => itemHtml(t, true)).join('') : '<div class="empty">ตอนนี้ไม่ได้ยืมเครื่องมือไว้</div>';
    $('mineList').innerHTML = html;
    $('miniMine').innerHTML = html;
    bindActions($('mineList')); bindActions($('miniMine'));
  } catch (e) { toast(e.message, 'err'); }
}

async function loadAll() {
  busy(true);
  try {
    allTools = await api('list');
    renderAll();
  } catch (e) { toast(e.message, 'err'); }
  busy(false);
}
function renderAll() {
  const q = $('search').value.trim().toLowerCase();
  const list = allTools.filter(t => !q || [t.id, t.name, t.category].join(' ').toLowerCase().includes(q));
  $('allList').innerHTML = list.length ? list.map(t => itemHtml(t, false)).join('') : '<div class="empty">ไม่พบรายการ</div>';
  $('allList').querySelectorAll('.item').forEach((el, i) => el.onclick = () => openTool(list[i].id));
}
$('search').oninput = renderAll;

async function loadHist() {
  busy(true);
  try {
    const rows = await api('history');
    $('histList').innerHTML = rows.length ? rows.map(r =>
      '<div class="hist"><span class="tag ' + (r.action === 'ยืม' ? 'b' : 'r') + '">' + esc(r.action) + '</span>' +
      '<div><div><b>' + esc(r.name) + '</b> <span class="d">(' + esc(r.id) + ')</span></div>' +
      '<div class="d">' + esc(r.time) + (r.note ? ' · ' + esc(r.note) : '') + '</div></div></div>'
    ).join('') : '<div class="empty">ยังไม่มีประวัติ</div>';
  } catch (e) { toast(e.message, 'err'); }
  busy(false);
}

/* ---------- สแกน / ค้นหา ---------- */
$('btnScan').onclick = async () => {
  try {
    if (!liff.isInClient()) {
      toast('การสแกนใช้ได้ในแอป LINE เท่านั้น — พิมพ์รหัสแทนได้', 'err');
      $('manualId').focus();
      return;
    }
    const r = await liff.scanCodeV2();
    if (r && r.value) openTool(r.value);
  } catch (e) {
    toast('สแกนไม่สำเร็จ: ' + (e.message || e), 'err');
  }
};
$('btnManual').onclick = () => {
  const v = $('manualId').value.trim();
  if (v) openTool(v);
};
$('manualId').onkeydown = e => { if (e.key === 'Enter') $('btnManual').click(); };

/* ---------- sheet ---------- */
async function openTool(raw) {
  // รองรับ QR ที่เป็น URL ที่มี ?tool=รหัส
  let id = String(raw).trim();
  try { const u = new URL(id); id = u.searchParams.get('tool') || id; } catch (e) {}
  busy(true);
  try {
    current = await api('getTool', { id });
    renderSheet();
  } catch (e) { toast(e.message, 'err'); }
  busy(false);
}

function renderSheet() {
  const t = current;
  const out = t.status === 'ถูกยืม';
  const mineNow = out && t.borrowerId === me.id;
  $('sIcon').textContent = out ? '🔒' : '🔧';
  $('sName').textContent = t.name;
  $('sMeta').textContent = t.id + (t.category ? ' · ' + t.category : '') + ' · ' + (out ? 'ถูกยืม' : 'ว่าง');
  const w = $('sWarn');
  if (out && !mineNow) {
    w.style.display = 'block';
    w.textContent = 'เครื่องมือนี้ถูก ' + t.borrower + ' ยืมไว้เมื่อ ' + t.since + ' — หากคืนแทน ระบบจะบันทึกว่าคุณเป็นผู้คืน';
  } else if (mineNow) {
    w.style.display = 'block';
    w.textContent = 'คุณยืมไว้เมื่อ ' + t.since;
  } else { w.style.display = 'none'; }
  const b = $('sAct');
  b.textContent = out ? 'ยืนยันการคืน' : 'ยืนยันการยืม';
  b.className = 'btn ' + (out ? 'ret' : '');
  b.disabled = false;
  $('sNote').value = '';
  $('overlay').classList.add('show');
  $('sheet').classList.add('show');
}
function closeSheet() {
  $('overlay').classList.remove('show');
  $('sheet').classList.remove('show');
}
$('overlay').onclick = closeSheet;
$('sCancel').onclick = closeSheet;

$('sAct').onclick = async () => {
  if (!current) return;
  const out = current.status === 'ถูกยืม';
  const b = $('sAct');
  b.disabled = true;
  busy(true);
  try {
    await api(out ? 'ret' : 'borrow', { id: current.id, note: $('sNote').value.trim() });
    closeSheet();
    toast((out ? 'คืน ' : 'ยืม ') + current.name + ' เรียบร้อย ✓', 'ok');
    $('manualId').value = '';
    loadMine();
    if ($('tab-all').classList.contains('active')) loadAll();
  } catch (e) {
    toast(e.message, 'err');
    b.disabled = false;
  }
  busy(false);
};

/* ---------- เริ่มต้น ---------- */
(async function init() {
  try {
    if (LIFF_ID.indexOf('ใส่') === 0 || API_URL.indexOf('ใส่') === 0) {
      return fatal('ยังไม่ได้ตั้งค่า LIFF_ID และ API_URL ในไฟล์ index.html');
    }
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const p = await liff.getProfile();
    me = { id: p.userId, name: p.displayName };
    $('uname').textContent = p.displayName;
    if (p.pictureUrl) $('avatar').src = p.pictureUrl;
    $('app').style.display = 'block';
    loadMine();

    // เปิดผ่านลิงก์ที่มี ?tool=รหัส (เช่น QR แบบ URL)
    const q = new URLSearchParams(location.search).get('tool');
    if (q) openTool(q);
  } catch (e) {
    fatal(e.message || e);
  }
})();
</script>
</body>
</html>
